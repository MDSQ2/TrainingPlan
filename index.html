<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aquathlon">
<title>Aquathlon Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c18;
  --surface: #0f1628;
  --surface2: #161d34;
  --surface3: #1c2440;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #eef2ff;
  --text-muted: #8892b0;
  --text-dim: #4a5568;
  --accent-swim: #00d4ff;
  --accent-run: #ff6b35;
  --accent-rest: #48bb78;
  --accent-pre: #68d391;
  --accent-during: #f6ad55;
  --accent-post: #76e4f7;
  --gold: #ffd700;
  --radius: 12px;
  --radius-lg: 18px;
}
 
* { box-sizing: border-box; margin: 0; padding: 0; }
 
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
 
body { min-height: 100vh; padding-bottom: 80px; }
 
/* ─── NOISE TEXTURE OVERLAY ─── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 1000; opacity: 0.4;
}
 
/* ─── HEADER ─── */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(8,12,24,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.app-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  letter-spacing: 2px;
  color: var(--text);
}
.app-logo span { color: var(--accent-swim); }
.header-date {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-align: right;
}
 
/* ─── MAIN CONTAINER ─── */
.container { max-width: 680px; margin: 0 auto; padding: 0 16px; }
 
/* ─── PROGRESS HERO ─── */
.progress-hero {
  margin: 20px 0 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  position: relative; overflow: hidden;
}
.progress-hero::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent-swim), var(--accent-run));
}
.progress-top {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 14px;
}
.progress-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-muted);
}
.progress-pct {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px; line-height: 1;
  color: var(--text);
}
.progress-pct span { font-size: 20px; color: var(--text-muted); }
.progress-track {
  height: 6px; background: var(--surface3);
  border-radius: 3px; overflow: hidden; margin-bottom: 14px;
}
.progress-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--accent-swim), var(--accent-run));
  transition: width 0.8s cubic-bezier(.16,1,.3,1);
}
.progress-stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
}
.progress-stat {
  background: var(--surface2); border-radius: 8px; padding: 10px 12px;
  text-align: center;
}
.progress-stat-num {
  font-family: 'DM Mono', monospace;
  font-size: 18px; font-weight: 500;
  color: var(--text);
}
.progress-stat-lbl {
  font-size: 10px; color: var(--text-muted);
  letter-spacing: 0.5px; margin-top: 2px;
}
 
/* ─── PHASE BADGE ─── */
.phase-strip {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px; padding: 12px 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius);
}
.phase-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.phase-name { font-weight: 500; font-size: 13px; color: var(--text); flex: 1; }
.phase-weeks {
  font-family: 'DM Mono', monospace;
  font-size: 11px; color: var(--text-muted);
}
 
/* ─── TODAY CARD ─── */
.today-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 16px;
  overflow: hidden;
}
.today-card-header {
  display: flex; align-items: center;
  padding: 16px 20px 14px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.today-type-badge {
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  padding: 4px 10px; border-radius: 20px; flex-shrink: 0;
}
.badge-swim { background: rgba(0,212,255,0.12); color: var(--accent-swim); }
.badge-run  { background: rgba(255,107,53,0.12); color: var(--accent-run); }
.badge-rest { background: rgba(72,187,120,0.12); color: var(--accent-rest); }
.today-title { font-size: 16px; font-weight: 500; flex: 1; }
.complete-btn {
  display: flex; align-items: center; gap: 8px;
  background: none; border: 1px solid var(--border2);
  border-radius: 8px; padding: 8px 14px;
  color: var(--text-muted); font-family: 'DM Sans', sans-serif;
  font-size: 12px; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
}
.complete-btn:hover { border-color: var(--accent-rest); color: var(--accent-rest); }
.complete-btn.done { border-color: var(--accent-rest); color: var(--accent-rest); background: rgba(72,187,120,0.1); }
.complete-btn .cb-box {
  width: 16px; height: 16px; border-radius: 4px;
  border: 1.5px solid currentColor;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.complete-btn.done .cb-box::after {
  content: '✓'; font-size: 10px; font-weight: 600;
}
.today-card-body { padding: 16px 20px; }
.workout-detail { font-size: 13px; color: var(--text-muted); line-height: 1.7; margin-bottom: 12px; }
.zones-row { display: flex; gap: 6px; flex-wrap: wrap; }
.zone-pill {
  font-family: 'DM Mono', monospace;
  font-size: 10px; padding: 3px 9px; border-radius: 12px; letter-spacing: 0.5px;
}
.z1 { background: rgba(54,162,235,0.12); color: #63b3ed; }
.z2 { background: rgba(72,187,120,0.12); color: #68d391; }
.z3 { background: rgba(246,173,85,0.12); color: #f6ad55; }
.z4 { background: rgba(252,129,74,0.12); color: #fc8149; }
.z5 { background: rgba(245,101,101,0.12); color: #fc8181; }
 
/* ─── NUTRITION SECTION ─── */
.nutrition-section { margin-bottom: 16px; }
.section-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 10px; padding: 0 2px;
}
.nut-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.nut-cards.three { grid-template-columns: 1fr; }
.nut-cards.three .nut-card:first-child,
.nut-cards.three .nut-card:nth-child(2) {
  /* two columns for pre/post, full for during */
}
.nut-cards-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.nut-card {
  border-radius: var(--radius); padding: 14px;
  border: 1px solid var(--border);
  position: relative; overflow: hidden;
}
.nut-card::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
}
.nut-pre { background: rgba(104,211,145,0.05); }
.nut-pre::before { background: var(--accent-pre); }
.nut-post { background: rgba(118,228,247,0.05); }
.nut-post::before { background: var(--accent-post); }
.nut-during { background: rgba(246,173,85,0.05); }
.nut-during::before { background: var(--accent-during); }
.nut-rest { background: rgba(255,255,255,0.02); grid-column: 1/-1; }
.nut-rest::before { background: var(--text-dim); }
.nut-type {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  margin-bottom: 6px;
}
.nut-pre .nut-type { color: var(--accent-pre); }
.nut-post .nut-type { color: var(--accent-post); }
.nut-during .nut-type { color: var(--accent-during); }
.nut-rest .nut-type { color: var(--text-dim); }
.nut-timing {
  font-family: 'DM Mono', monospace;
  font-size: 11px; font-weight: 500;
  margin-bottom: 8px; color: var(--text);
}
.nut-items { font-size: 12px; color: var(--text-muted); line-height: 1.65; }
.nut-note { font-size: 11px; color: var(--text-dim); margin-top: 8px; font-style: italic; border-top: 1px solid var(--border); padding-top: 6px; }
 
/* ─── WEEK OVERVIEW ─── */
.week-strip {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px 20px; margin-bottom: 16px;
}
.week-strip-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
}
.week-strip-title { font-size: 13px; font-weight: 500; }
.week-strip-sub {
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--text-muted); letter-spacing: 1px;
}
.week-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wday {
  border-radius: 8px; padding: 8px 4px;
  text-align: center; border: 1px solid var(--border);
  background: var(--surface2); position: relative;
  cursor: default;
}
.wday.today-marker { border-color: var(--accent-swim); background: rgba(0,212,255,0.06); }
.wday-name {
  font-family: 'DM Mono', monospace;
  font-size: 9px; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 5px;
}
.wday.today-marker .wday-name { color: var(--accent-swim); }
.wday-dot {
  width: 8px; height: 8px; border-radius: 50%;
  margin: 0 auto 4px; background: var(--surface3);
}
.wday-dot.swim { background: var(--accent-swim); }
.wday-dot.run  { background: var(--accent-run); }
.wday-dot.rest { background: var(--surface3); }
.wday-done::after {
  content: '✓';
  font-size: 8px; color: var(--accent-rest);
  position: absolute; top: 4px; right: 5px;
}
.wday-type-lbl {
  font-size: 8px; color: var(--text-dim); letter-spacing: 0.3px;
}
.wday.today-marker .wday-type-lbl { color: var(--accent-swim); }
 
/* ─── HISTORY ─── */
.history-section { margin-bottom: 16px; }
.history-toggle {
  width: 100%; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 18px;
  color: var(--text-muted); font-family: 'DM Sans', sans-serif;
  font-size: 13px; cursor: pointer; text-align: left;
  display: flex; justify-content: space-between; align-items: center;
  transition: background 0.2s;
}
.history-toggle:hover { background: var(--surface2); }
.history-chevron { transition: transform 0.3s; font-size: 12px; }
.history-chevron.open { transform: rotate(180deg); }
.history-list {
  background: var(--surface); border: 1px solid var(--border);
  border-top: none; border-radius: 0 0 var(--radius) var(--radius);
  max-height: 320px; overflow-y: auto;
  display: none;
}
.history-list.open { display: block; }
.history-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 18px; border-bottom: 1px solid var(--border);
}
.history-item:last-child { border-bottom: none; }
.history-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.history-date {
  font-family: 'DM Mono', monospace; font-size: 11px;
  color: var(--text-muted); min-width: 90px;
}
.history-desc { font-size: 12px; color: var(--text); flex: 1; }
.history-phase { font-size: 10px; color: var(--text-dim); }
.history-empty { padding: 24px; text-align: center; font-size: 12px; color: var(--text-dim); }
 
/* ─── BOTTOM NAV ─── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(8,12,24,0.96); backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; z-index: 200; padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 12px 8px;
  background: none; border: none; color: var(--text-dim);
  font-family: 'DM Sans', sans-serif; font-size: 10px; letter-spacing: 0.5px;
  cursor: pointer; transition: color 0.2s;
}
.nav-btn.active { color: var(--accent-swim); }
.nav-btn svg { width: 20px; height: 20px; }
 
/* ─── VIEWS ─── */
.view { display: none; }
.view.active { display: block; }
 
/* ─── CALENDAR VIEW ─── */
.calendar-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-top: 20px; }
.cal-nav {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-muted); font-size: 18px; flex-shrink: 0;
  transition: background 0.2s;
}
.cal-nav:hover { background: var(--surface2); }
.cal-month {
  font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px;
  flex: 1; text-align: center;
}
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  margin-bottom: 20px;
}
.cal-day-name {
  font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1px;
  color: var(--text-dim); text-align: center; padding: 6px 0;
}
.cal-cell {
  aspect-ratio: 1; border-radius: 8px; display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  border: 1px solid transparent; background: var(--surface2);
  position: relative; cursor: pointer; transition: all 0.15s;
}
.cal-cell:hover { border-color: var(--border2); }
.cal-cell.other-month { opacity: 0.25; pointer-events: none; }
.cal-cell.today-cell { border-color: var(--accent-swim); }
.cal-cell.completed { background: rgba(72,187,120,0.1); }
.cal-cell-num { font-size: 12px; font-weight: 500; color: var(--text); }
.cal-cell.today-cell .cal-cell-num { color: var(--accent-swim); }
.cal-cell-dot { width: 4px; height: 4px; border-radius: 50%; margin-top: 2px; }
.cal-check { position: absolute; top: 3px; right: 4px; font-size: 8px; color: var(--accent-rest); }
 
/* ─── STATS VIEW ─── */
.stats-view { padding-top: 20px; }
.stats-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px;
  margin-bottom: 20px;
}
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.stats-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
}
.stats-card-num {
  font-family: 'Bebas Neue', sans-serif; font-size: 36px;
  line-height: 1; margin-bottom: 4px;
}
.stats-card-lbl { font-size: 11px; color: var(--text-muted); }
.streak-card {
  grid-column: 1/-1;
  background: linear-gradient(135deg, rgba(0,212,255,0.08), rgba(255,107,53,0.08));
  border: 1px solid rgba(0,212,255,0.2);
}
.phase-breakdown { margin-bottom: 20px; }
.phase-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.phase-bar-label { font-size: 12px; color: var(--text-muted); min-width: 90px; }
.phase-bar-track { flex: 1; height: 4px; background: var(--surface3); border-radius: 2px; }
.phase-bar-fill { height: 100%; border-radius: 2px; }
.phase-bar-pct {
  font-family: 'DM Mono', monospace; font-size: 10px;
  color: var(--text-dim); min-width: 32px; text-align: right;
}
 
/* ─── ANIMATIONS ─── */
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.today-card, .progress-hero, .phase-strip, .nutrition-section,
.week-strip, .history-section {
  animation: fadeSlideUp 0.4s ease both;
}
.today-card { animation-delay: 0.05s; }
.nutrition-section { animation-delay: 0.1s; }
.week-strip { animation-delay: 0.15s; }
.history-section { animation-delay: 0.2s; }
 
@keyframes completeFlash {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.04); }
  100% { transform: scale(1); }
}
.complete-flash { animation: completeFlash 0.3s ease; }
</style>
</head>
<body>
 
<header class="app-header">
  <div class="app-logo">AQU<span>A</span>THLON</div>
  <div class="header-date" id="headerDate"></div>
</header>
 
<!-- ─── TODAY VIEW ─── -->
<div class="view active" id="view-today">
  <div class="container">
 
    <div class="progress-hero">
      <div class="progress-top">
        <div>
          <div class="progress-label">Training Progress</div>
          <div class="progress-pct" id="progPct">0<span>%</span></div>
        </div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progFill" style="width:0%"></div>
      </div>
      <div class="progress-stats">
        <div class="progress-stat">
          <div class="progress-stat-num" id="statWeek">–</div>
          <div class="progress-stat-lbl">Current week</div>
        </div>
        <div class="progress-stat">
          <div class="progress-stat-num" id="statDone">0</div>
          <div class="progress-stat-lbl">Completed</div>
        </div>
        <div class="progress-stat">
          <div class="progress-stat-num" id="statLeft">–</div>
          <div class="progress-stat-lbl">Days left</div>
        </div>
      </div>
    </div>
 
    <div class="phase-strip" id="phaseStrip">
      <div class="phase-dot" id="phaseDot"></div>
      <div class="phase-name" id="phaseName"></div>
      <div class="phase-weeks" id="phaseWeeks"></div>
    </div>
 
    <div class="today-card" id="todayCard">
      <div class="today-card-header">
        <div class="today-type-badge" id="todayBadge"></div>
        <div class="today-title" id="todayTitle"></div>
        <button class="complete-btn" id="completeBtn" onclick="toggleComplete()">
          <div class="cb-box"></div>
          <span id="completeBtnText">Mark done</span>
        </button>
      </div>
      <div class="today-card-body">
        <div class="workout-detail" id="todayDetail"></div>
        <div class="zones-row" id="zonesRow"></div>
        <div style="margin-top: 10px; font-family:'DM Mono',monospace; font-size:11px; color:var(--text-dim)" id="todayDuration"></div>
      </div>
    </div>
 
    <div class="nutrition-section">
      <div class="section-label">Nutrition plan</div>
      <div id="nutritionCards"></div>
    </div>
 
    <div class="week-strip">
      <div class="week-strip-header">
        <div class="week-strip-title" id="weekStripTitle">This week</div>
        <div class="week-strip-sub" id="weekStripSub"></div>
      </div>
      <div class="week-days" id="weekDays"></div>
    </div>
 
    <div class="history-section">
      <button class="history-toggle" onclick="toggleHistory()">
        <span>Completion history</span>
        <span class="history-chevron" id="historyChevron">▼</span>
      </button>
      <div class="history-list" id="historyList"></div>
    </div>
 
  </div>
</div>
 
<!-- ─── CALENDAR VIEW ─── -->
<div class="view" id="view-calendar">
  <div class="container">
    <div class="calendar-header">
      <div class="cal-nav" onclick="changeCalMonth(-1)">‹</div>
      <div class="cal-month" id="calMonth"></div>
      <div class="cal-nav" onclick="changeCalMonth(1)">›</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
</div>
 
<!-- ─── STATS VIEW ─── -->
<div class="view" id="view-stats">
  <div class="container stats-view">
    <div class="stats-title">YOUR STATS</div>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="section-label" style="margin-bottom:10px">Phase breakdown</div>
    <div class="phase-breakdown" id="phaseBreakdown"></div>
  </div>
</div>
 
<!-- ─── BOTTOM NAV ─── -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-today" onclick="switchView('today')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    Today

/* ══════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════ */
function getWeekNumber(date) {
  const diff = date - PLAN_START;
  const dayNum = Math.floor(diff / 86400000);
  if (dayNum < 0) return null;
  return Math.min(Math.floor(dayNum / 7) + 1, TOTAL_WEEKS);
}
 
function getDayOfWeek(date) {
  // 0=Sun,1=Mon,...6=Sat → map to plan index 0=Mon
  const d = date.getDay();
  return d === 0 ? 6 : d - 1;
}
 
function getTemplate(week) {
  if (week === null) return weekTemplates[0];
  for (const t of weekTemplates) {
    if (week >= t.weekRange[0] && week <= t.weekRange[1]) return t;
  }
  return weekTemplates[weekTemplates.length - 1];
}
 
function getPhase(week) {
  if (week === null) return phases[0];
  for (const p of phases) {
    if (week >= p.start && week <= p.end) return p;
  }
  return phases[phases.length - 1];
}
 
function dateKey(date) {
  return date.toISOString().split('T')[0];
}
 
function formatDate(date) {
  return date.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
 
/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
let completed = {};
let calViewDate = new Date();
 
function loadState() {
  try { completed = JSON.parse(localStorage.getItem('aq_completed') || '{}'); } catch(e) { completed = {}; }
}
function saveState() {
  localStorage.setItem('aq_completed', JSON.stringify(completed));
}
 
/* ══════════════════════════════════════════════
   RENDER TODAY
══════════════════════════════════════════════ */
function renderToday() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const week = getWeekNumber(today);
  const dayIdx = getDayOfWeek(today);
  const tmpl = getTemplate(week);
  const day = tmpl.days[dayIdx];
  const phase = getPhase(week);
  const key = dateKey(today);
  const isDone = !!completed[key];
 
  // Header date
  document.getElementById('headerDate').innerHTML =
    today.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}).toUpperCase()
    + '<br>WEEK ' + (week||'–') + ' / 104';
 
  // Progress
  const totalDays = TOTAL_WEEKS * 7;
  const daysPassed = week !== null ? Math.min((week-1)*7 + dayIdx + 1, totalDays) : 0;
  const pct = week !== null ? Math.round((daysPassed / totalDays) * 100) : 0;
  document.getElementById('progPct').innerHTML = pct + '<span>%</span>';
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('statWeek').textContent = week || '–';
  document.getElementById('statDone').textContent = Object.keys(completed).length;
  const daysLeft = week !== null ? Math.max(0, totalDays - daysPassed) : totalDays;
  document.getElementById('statLeft').textContent = daysLeft;
 
  // Phase strip
  document.getElementById('phaseDot').style.background = phase.color;
  document.getElementById('phaseName').textContent = phase.name;
  document.getElementById('phaseWeeks').textContent = phase.months;
 
  // Today card
  const badge = document.getElementById('todayBadge');
  badge.textContent = day.type;
  badge.className = 'today-type-badge badge-' + day.type;
  document.getElementById('todayTitle').textContent = day.title;
  document.getElementById('todayDetail').textContent = day.detail;
  document.getElementById('todayDuration').textContent = '⏱ ' + day.duration;
 
  const zonesRow = document.getElementById('zonesRow');
  zonesRow.innerHTML = day.zones.map(z =>
    `<span class="zone-pill ${z.toLowerCase()}">${z}</span>`
  ).join('');
 
  const btn = document.getElementById('completeBtn');
  btn.className = 'complete-btn' + (isDone ? ' done' : '');
  document.getElementById('completeBtnText').textContent = isDone ? 'Completed' : 'Mark done';
 
  // Nutrition
  renderNutrition(day.nutKey, day.type);
 
  // Week strip
  renderWeekStrip(week, today, dayIdx);
 
  // History
  renderHistory();
}
 
function renderNutrition(key, type) {
  const nut = nutrition[key];
  const container = document.getElementById('nutritionCards');
  if (!nut) { container.innerHTML = ''; return; }
 
  if (key === 'rest') {
    container.innerHTML = `
      <div class="nut-cards">
        <div class="nut-card nut-rest" style="grid-column:1/-1">
          <div class="nut-type">Rest day nutrition</div>
          <div class="nut-items">${nut.general}</div>
        </div>
      </div>`;
    return;
  }
 
  let html = '';
  const hasDuring = !!nut.during;
 
  if (!hasDuring) {
    html = `<div class="nut-cards">
      ${nutCard('pre', nut.pre)}
      ${nutCard('post', nut.post)}
    </div>`;
  } else {
    html = `<div class="nut-cards-row">
      ${nutCard('pre', nut.pre)}
      ${nutCard('post', nut.post)}
    </div>
    <div class="nut-cards">
      ${nutCard('during', nut.during, true)}
    </div>`;
  }
  container.innerHTML = html;
}
 
function nutCard(type, data, full) {
  const labels = { pre:'Pre-workout', post:'Post-workout', during:'During session' };
  const fullStyle = full ? 'grid-column:1/-1' : '';
  return `<div class="nut-card nut-${type}" style="${fullStyle}">
    <div class="nut-type">${labels[type]}</div>
    <div class="nut-timing">${data.timing}</div>
    <div class="nut-items">${data.items}</div>
    ${data.note ? `<div class="nut-note">${data.note}</div>` : ''}
  </div>`;
}
 
function renderWeekStrip(week, today, todayIdx) {
  const tmpl = getTemplate(week);
  document.getElementById('weekStripTitle').textContent = week ? `Week ${week}` : 'Pre-plan';
  document.getElementById('weekStripSub').textContent = tmpl.label.toUpperCase();
 
  const strip = document.getElementById('weekDays');
  strip.innerHTML = tmpl.days.map((d, i) => {
    const dayDate = new Date(today);
    dayDate.setDate(today.getDate() - todayIdx + i);
    const k = dateKey(dayDate);
    const isDone = !!completed[k];
    const isToday = i === todayIdx;
    return `<div class="wday${isToday?' today-marker':''}${isDone?' wday-done':''}">
      <div class="wday-name">${d.name}</div>
      <div class="wday-dot ${d.type}"></div>
      <div class="wday-type-lbl">${d.type}</div>
    </div>`;
  }).join('');
}
 
function renderHistory() {
  const list = document.getElementById('historyList');
  const entries = Object.entries(completed)
    .sort((a,b) => b[0].localeCompare(a[0]))
    .slice(0, 50);
 
  if (!entries.length) {
    list.innerHTML = '<div class="history-empty">No completed workouts yet.<br>Mark your first session as done above.</div>';
    return;
  }
 
  list.innerHTML = entries.map(([key, info]) => {
    const d = new Date(key);
    const formatted = d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    const dotColor = info.type === 'swim' ? 'var(--accent-swim)' :
                     info.type === 'run'  ? 'var(--accent-run)'  : 'var(--accent-rest)';
    return `<div class="history-item">
      <div class="history-dot" style="background:${dotColor}"></div>
      <div class="history-date">${formatted}</div>
      <div class="history-desc">${info.title || 'Workout'}</div>
      <div class="history-phase">${info.phase || ''}</div>
    </div>`;
  }).join('');
}
 
/* ══════════════════════════════════════════════
   COMPLETE TOGGLE
══════════════════════════════════════════════ */
function toggleComplete() {
  const today = new Date(); today.setHours(0,0,0,0);
  const key = dateKey(today);
  const week = getWeekNumber(today);
  const dayIdx = getDayOfWeek(today);
  const tmpl = getTemplate(week);
  const day = tmpl.days[dayIdx];
  const phase = getPhase(week);
 
  if (completed[key]) {
    delete completed[key];
  } else {
    completed[key] = { type: day.type, title: day.title, phase: phase.name, week };
  }
  saveState();
 
  // Flash animation
  const card = document.getElementById('todayCard');
  card.classList.remove('complete-flash');
  void card.offsetWidth;
  card.classList.add('complete-flash');
 
  renderToday();
}
 
/* ══════════════════════════════════════════════
   CALENDAR
══════════════════════════════════════════════ */
function changeCalMonth(dir) {
  calViewDate = new Date(calViewDate.getFullYear(), calViewDate.getMonth() + dir, 1);
  renderCalendar();
}
 
function renderCalendar() {
  const today = new Date(); today.setHours(0,0,0,0);
  const y = calViewDate.getFullYear();
  const m = calViewDate.getMonth();
  document.getElementById('calMonth').textContent =
    new Date(y,m,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}).toUpperCase();
 
  const firstDay = new Date(y, m, 1);
  const startOffset = (firstDay.getDay() + 6) % 7; // Mon=0
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const dayNames = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
 
  let html = dayNames.map(n => `<div class="cal-day-name">${n}</div>`).join('');
 
  for (let i = 0; i < startOffset; i++) {
    html += `<div class="cal-cell other-month"><div class="cal-cell-num"></div></div>`;
  }
 
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(y, m, d);
    const k = dateKey(date);
    const isTodayCell = dateKey(date) === dateKey(today);
    const isDone = !!completed[k];
    const week = getWeekNumber(date);
    const dayIdx = getDayOfWeek(date);
    const tmpl = getTemplate(week);
    const dayData = week !== null ? tmpl.days[dayIdx] : null;
    const dotColor = dayData ? (dayData.type === 'swim' ? 'var(--accent-swim)' : dayData.type === 'run' ? 'var(--accent-run)' : 'transparent') : 'transparent';
 
    html += `<div class="cal-cell${isTodayCell?' today-cell':''}${isDone?' completed':''}">
      ${isDone ? '<span class="cal-check">✓</span>' : ''}
      <div class="cal-cell-num">${d}</div>
      <div class="cal-cell-dot" style="background:${dotColor}"></div>
    </div>`;
  }
 
  document.getElementById('calGrid').innerHTML = html;
}
 
/* ══════════════════════════════════════════════
   STATS
══════════════════════════════════════════════ */
function renderStats() {
  const total = Object.keys(completed).length;
  const swims = Object.values(completed).filter(v=>v.type==='swim').length;
  const runs  = Object.values(completed).filter(v=>v.type==='run').length;
 
  // Streak
  let streak = 0;
  const today = new Date(); today.setHours(0,0,0,0);
  for (let i = 0; i < 365; i++) {
    const d = new Date(today); d.setDate(today.getDate() - i);
    const k = dateKey(d);
    const week = getWeekNumber(d);
    const dayData = week !== null ? getTemplate(week).days[getDayOfWeek(d)] : null;
    if (dayData && dayData.type !== 'rest') {
      if (completed[k]) { streak++; } else { break; }
    }
  }
 
  const today2 = new Date(); today2.setHours(0,0,0,0);
  const week = getWeekNumber(today2);
  const pct = week !== null ? Math.round(((week-1)*7 / (TOTAL_WEEKS*7)) * 100) : 0;
 
  document.getElementById('statsGrid').innerHTML = `
    <div class="stats-card">
      <div class="stats-card-num" style="color:var(--accent-swim)">${total}</div>
      <div class="stats-card-lbl">Total workouts</div>
    </div>
    <div class="stats-card">
      <div class="stats-card-num" style="color:var(--accent-run)">${streak}</div>
      <div class="stats-card-lbl">Current streak</div>
    </div>
    <div class="stats-card">
      <div class="stats-card-num" style="color:var(--accent-swim)">${swims}</div>
      <div class="stats-card-lbl">Swims done</div>
    </div>
    <div class="stats-card">
      <div class="stats-card-num" style="color:var(--accent-run)">${runs}</div>
      <div class="stats-card-lbl">Runs done</div>
    </div>
    <div class="stats-card streak-card">
      <div class="stats-card-num" style="color:var(--gold)">${pct}%</div>
      <div class="stats-card-lbl">Overall plan progress — Week ${week||0} of ${TOTAL_WEEKS}</div>
    </div>`;
 
  const breakdown = phases.map(p => {
    const phTotal = (p.end - p.start + 1) * 7;
    const phDone = Object.values(completed).filter(v=>v.week>=p.start&&v.week<=p.end).length;
    const phasePct = Math.min(100, Math.round((phDone / phTotal) * 100));
    return `<div class="phase-bar-row">
      <div class="phase-bar-label">${p.name}</div>
      <div class="phase-bar-track"><div class="phase-bar-fill" style="width:${phasePct}%;background:${p.color}"></div></div>
      <div class="phase-bar-pct">${phasePct}%</div>
    </div>`;
  }).join('');
  document.getElementById('phaseBreakdown').innerHTML = breakdown;
}
 
/* ══════════════════════════════════════════════
   NAV
══════════════════════════════════════════════ */
function switchView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.getElementById('nav-' + view).classList.add('active');
 
  if (view === 'calendar') renderCalendar();
  if (view === 'stats') renderStats();
}
 
function toggleHistory() {
  const list = document.getElementById('historyList');
  const chevron = document.getElementById('historyChevron');
  const open = list.classList.toggle('open');
  chevron.classList.toggle('open', open);
  if (open) renderHistory();
}
 
/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
loadState();
renderToday();
</script>
