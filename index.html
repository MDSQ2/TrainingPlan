<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080c18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="70.3 Training">
<title>Ironman 70.3 Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080c18; --surface:#0f1628; --surface2:#161d34; --surface3:#1c2440;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
  --text:#eef2ff; --text-muted:#8892b0; --text-dim:#4a5568;
  --swim:#00d4ff; --run:#ff6b35; --bike:#a78bfa; --rest:#48bb78;
  --pre:#68d391; --during:#f6ad55; --post:#76e4f7; --gold:#ffd700;
  --r:12px; --rl:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{min-height:100vh;padding-bottom:84px}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:999;opacity:.4}
 
/* HEADER */
.app-header{position:sticky;top:0;z-index:100;background:rgba(8,12,24,.93);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.app-logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px}
.app-logo .hi{color:var(--swim)}
.header-meta{text-align:right;font-family:'DM Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:.8px;line-height:1.7}
 
/* CONTAINER */
.container{max-width:680px;margin:0 auto;padding:0 16px}
 
/* PROGRESS HERO */
.progress-hero{margin:18px 0 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:20px;position:relative;overflow:hidden}
.progress-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--swim),var(--bike),var(--run))}
.prog-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.prog-pct{font-family:'Bebas Neue',sans-serif;font-size:48px;line-height:1;color:var(--text)}
.prog-pct small{font-size:22px;color:var(--text-muted)}
.prog-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px}
.prog-track{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-bottom:14px}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--swim),var(--bike),var(--run));transition:width .8s cubic-bezier(.16,1,.3,1)}
.prog-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pstat{background:var(--surface2);border-radius:8px;padding:10px 12px;text-align:center}
.pstat-n{font-family:'DM Mono',monospace;font-size:17px;font-weight:500;color:var(--text)}
.pstat-l{font-size:10px;color:var(--text-muted);margin-top:2px}
 
/* PHASE STRIP */
.phase-strip{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.phase-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.phase-name{font-weight:500;font-size:13px;flex:1}
.phase-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-muted)}
 
/* DISCIPLINE ICONS STRIP */
.disc-strip{display:flex;gap:8px;margin-bottom:14px}
.disc-pill{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 10px;border-radius:var(--r);border:1px solid var(--border);font-size:11px;font-weight:500;background:var(--surface2)}
.disc-pill.active-swim{border-color:var(--swim);background:rgba(0,212,255,.08);color:var(--swim)}
.disc-pill.active-run{border-color:var(--run);background:rgba(255,107,53,.08);color:var(--run)}
.disc-pill.active-bike{border-color:var(--bike);background:rgba(167,139,250,.08);color:var(--bike)}
.disc-pill.inactive{color:var(--text-dim);border-color:var(--border);background:var(--surface2);opacity:.4}
.disc-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
 
/* TODAY CARD */
.today-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:14px;overflow:hidden}
.today-hdr{display:flex;align-items:center;gap:10px;padding:14px 18px 12px;border-bottom:1px solid var(--border)}
.type-badge{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:20px;flex-shrink:0}
.badge-swim{background:rgba(0,212,255,.12);color:var(--swim)}
.badge-run{background:rgba(255,107,53,.12);color:var(--run)}
.badge-bike{background:rgba(167,139,250,.12);color:var(--bike)}
.badge-rest{background:rgba(72,187,120,.1);color:var(--rest)}
.badge-brick{background:rgba(255,215,0,.1);color:var(--gold)}
.today-title{font-size:15px;font-weight:500;flex:1}
.done-btn{display:flex;align-items:center;gap:7px;background:none;border:1px solid var(--border2);border-radius:8px;padding:7px 13px;color:var(--text-muted);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;flex-shrink:0}
.done-btn:hover{border-color:var(--rest);color:var(--rest)}
.done-btn.done{border-color:var(--rest);color:var(--rest);background:rgba(72,187,120,.1)}
.cb-box{width:15px;height:15px;border-radius:3px;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.done-btn.done .cb-box::after{content:'✓';font-size:9px;font-weight:700}
.today-body{padding:14px 18px}
.workout-detail{font-size:13px;color:var(--text-muted);line-height:1.75;margin-bottom:10px}
.zones-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.zpill{font-family:'DM Mono',monospace;font-size:10px;padding:3px 9px;border-radius:12px;letter-spacing:.5px}
.z1{background:rgba(54,162,235,.12);color:#63b3ed}
.z2{background:rgba(72,187,120,.12);color:#68d391}
.z3{background:rgba(246,173,85,.12);color:#f6ad55}
.z4{background:rgba(252,129,74,.12);color:#fc8149}
.z5{background:rgba(245,101,101,.12);color:#fc8181}
.dur-row{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-dim);margin-top:4px}
 
/* NUTRITION */
.nut-section{margin-bottom:14px}
.sec-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;padding:0 2px}
.nut-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nut-card{border-radius:var(--r);padding:13px;border:1px solid var(--border);position:relative;overflow:hidden}
.nut-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.nc-pre{background:rgba(104,211,145,.04)}.nc-pre::before{background:var(--pre)}
.nc-post{background:rgba(118,228,247,.04)}.nc-post::before{background:var(--post)}
.nc-during{background:rgba(246,173,85,.04)}.nc-during::before{background:var(--during)}
.nc-rest{background:rgba(255,255,255,.02)}.nc-rest::before{background:var(--text-dim)}
.nut-type{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px}
.nc-pre .nut-type{color:var(--pre)}.nc-post .nut-type{color:var(--post)}.nc-during .nut-type{color:var(--during)}.nc-rest .nut-type{color:var(--text-dim)}
.nut-timing{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;color:var(--text);margin-bottom:7px}
.nut-items{font-size:12px;color:var(--text-muted);line-height:1.65}
.nut-note{font-size:11px;color:var(--text-dim);font-style:italic;margin-top:7px;border-top:1px solid var(--border);padding-top:5px}
.span2{grid-column:1/-1}
 
/* WEEK STRIP */
.week-strip{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 18px;margin-bottom:14px}
.wstrip-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.wstrip-title{font-size:13px;font-weight:500}
.wstrip-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:1px}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wday{border-radius:8px;padding:8px 4px;text-align:center;border:1px solid var(--border);background:var(--surface2);position:relative}
.wday.is-today{border-color:var(--swim);background:rgba(0,212,255,.06)}
.wday-n{font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);letter-spacing:.8px;margin-bottom:5px}
.wday.is-today .wday-n{color:var(--swim)}
.wday-dot{width:7px;height:7px;border-radius:50%;margin:0 auto 3px}
.wday-dot.swim{background:var(--swim)}.wday-dot.run{background:var(--run)}.wday-dot.bike{background:var(--bike)}.wday-dot.brick{background:var(--gold)}.wday-dot.rest{background:var(--surface3)}
.wday-lbl{font-size:8px;color:var(--text-dim)}
.wday.is-today .wday-lbl{color:var(--swim)}
.wday-check{position:absolute;top:3px;right:4px;font-size:7px;color:var(--rest)}
 
/* HISTORY */
.hist-toggle{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 17px;color:var(--text-muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;transition:background .2s}
.hist-toggle:hover{background:var(--surface2)}
.hist-chev{transition:transform .3s;font-size:11px}
.hist-chev.open{transform:rotate(180deg)}
.hist-list{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--r) var(--r);max-height:300px;overflow-y:auto;display:none}
.hist-list.open{display:block}
.hist-item{display:flex;align-items:center;gap:9px;padding:9px 17px;border-bottom:1px solid var(--border)}
.hist-item:last-child{border-bottom:none}
.hist-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.hist-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-muted);min-width:88px}
.hist-desc{font-size:12px;color:var(--text);flex:1}
.hist-phase{font-size:10px;color:var(--text-dim)}
.hist-empty{padding:22px;text-align:center;font-size:12px;color:var(--text-dim)}
 
/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,12,24,.96);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom)}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 8px;background:none;border:none;color:var(--text-dim);font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:.5px;cursor:pointer;transition:color .2s}
.nbtn.active{color:var(--swim)}
.nbtn svg{width:20px;height:20px}
 
/* VIEWS */
.view{display:none}.view.active{display:block}
 
/* CALENDAR */
.cal-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-top:18px}
.cal-nav{background:var(--surface);border:1px solid var(--border);border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);font-size:18px;flex-shrink:0;transition:background .2s}
.cal-nav:hover{background:var(--surface2)}
.cal-month{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;flex:1;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:18px}
.cal-dn{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--text-dim);text-align:center;padding:5px 0}
.cal-cell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid transparent;background:var(--surface2);position:relative;cursor:default;transition:all .15s}
.cal-cell.today-c{border-color:var(--swim)}
.cal-cell.done-c{background:rgba(72,187,120,.1)}
.cal-cell.other-m{opacity:.2;pointer-events:none}
.cal-cell-n{font-size:12px;font-weight:500;color:var(--text)}
.cal-cell.today-c .cal-cell-n{color:var(--swim)}
.cal-cdot{width:4px;height:4px;border-radius:50%;margin-top:2px}
.cal-chk{position:absolute;top:3px;right:4px;font-size:8px;color:var(--rest)}
 
/* STATS */
.stats-view{padding-top:18px}
.stats-ttl{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;margin-bottom:18px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;margin-bottom:3px}
.stat-lbl{font-size:11px;color:var(--text-muted)}
.stat-card.hero-card{grid-column:1/-1;background:linear-gradient(135deg,rgba(0,212,255,.07),rgba(167,139,250,.07),rgba(255,107,53,.07));border:1px solid rgba(0,212,255,.18)}
.pb-row{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.pb-label{font-size:12px;color:var(--text-muted);min-width:110px}
.pb-track{flex:1;height:4px;background:var(--surface3);border-radius:2px}
.pb-fill{height:100%;border-radius:2px}
.pb-pct{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim);min-width:30px;text-align:right}
 
/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.progress-hero,.phase-strip,.disc-strip,.today-card,.nut-section,.week-strip{animation:fadeUp .35s ease both}
.today-card{animation-delay:.04s}.nut-section{animation-delay:.08s}.week-strip{animation-delay:.12s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.pop{animation:pop .25s ease}
</style>
</head>
<body>
 
<header class="app-header">
  <div class="app-logo">70<span class="hi">.3</span> TRAINING</div>
  <div class="header-meta" id="headerMeta"></div>
</header>
 
<!-- TODAY VIEW -->
<div class="view active" id="view-today">
<div class="container">
 
  <div class="progress-hero">
    <div class="prog-top">
      <div>
        <div class="prog-label">Plan Progress</div>
        <div class="prog-pct" id="progPct">0<small>%</small></div>
      </div>
    </div>
    <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="prog-stats">
      <div class="pstat"><div class="pstat-n" id="pWk">–</div><div class="pstat-l">Current week</div></div>
      <div class="pstat"><div class="pstat-n" id="pDone">0</div><div class="pstat-l">Completed</div></div>
      <div class="pstat"><div class="pstat-n" id="pLeft">–</div><div class="pstat-l">Days left</div></div>
    </div>
  </div>
 
  <div class="phase-strip">
    <div class="phase-dot" id="phaseDot"></div>
    <div class="phase-name" id="phaseName"></div>
    <div class="phase-sub" id="phaseSub"></div>
  </div>
 
  <div class="disc-strip" id="discStrip"></div>
 
  <div class="today-card" id="todayCard">
    <div class="today-hdr">
      <div class="type-badge" id="todayBadge"></div>
      <div class="today-title" id="todayTitle"></div>
      <button class="done-btn" id="doneBtn" onclick="toggleComplete()">
        <div class="cb-box"></div>
        <span id="doneTxt">Mark done</span>
      </button>
    </div>
    <div class="today-body">
      <div class="workout-detail" id="todayDetail"></div>
      <div class="zones-row" id="zonesRow"></div>
      <div class="dur-row" id="durRow"></div>
    </div>
  </div>
 
  <div class="nut-section">
    <div class="sec-label">Nutrition plan</div>
    <div id="nutCards"></div>
  </div>
 
  <div class="week-strip">
    <div class="wstrip-hdr">
      <div class="wstrip-title" id="wstripTitle">This week</div>
      <div class="wstrip-sub" id="wstripSub"></div>
    </div>
    <div class="wdays" id="wdays"></div>
  </div>
 
  <div style="margin-bottom:16px">
    <button class="hist-toggle" onclick="toggleHist()">
      <span>Completion history</span>
      <span class="hist-chev" id="histChev">▼</span>
    </button>
    <div class="hist-list" id="histList"></div>
  </div>
 
</div>
</div>
 
<!-- CALENDAR VIEW -->
<div class="view" id="view-calendar">
<div class="container">
  <div class="cal-header">
    <div class="cal-nav" onclick="calMonth(-1)">‹</div>
    <div class="cal-month" id="calMonth"></div>
    <div class="cal-nav" onclick="calMonth(1)">›</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>
</div>
 
<!-- STATS VIEW -->
<div class="view" id="view-stats">
<div class="container stats-view">
  <div class="stats-ttl">YOUR STATS</div>
  <div class="stats-grid" id="statsGrid"></div>
  <div class="sec-label" style="margin-bottom:10px">Phase breakdown</div>
  <div id="phaseBars"></div>
</div>
</div>
 
<nav class="bnav">
  <button class="nbtn active" id="nav-today" onclick="switchView('today')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Today
  </button>
  <button class="nbtn" id="nav-calendar" onclick="switchView('calendar')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Calendar
  </button>
  <button class="nbtn" id="nav-stats" onclick="switchView('stats')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 20h18M8 16V9m4 7V5m4 11v-4"/></svg>Stats
  </button>
</nav>
 
<script>
/* ═══════════════════════════════════════════════
   PLAN CONFIG
   Start date: adjust to your actual start date
═══════════════════════════════════════════════ */
const PLAN_START = new Date('2026-05-31');
const TOTAL_WEEKS = 104;
 
/* ═══════════════════════════════════════════════
   PHASES
═══════════════════════════════════════════════ */
const PHASES = [
  { id:'p1', name:'Swim & Run Base',         sub:'Months 1–4  ·  Weeks 1–17',   start:1,   end:17,  color:'#185FA5',
    desc:'Foundation phase. No cycling. Build aerobic engine through running (Tue/Thu) and swimming (Sat) only. All Z2 effort.' },
  { id:'p2', name:'Swim & Run Development',  sub:'Months 5–8  ·  Weeks 18–35',  start:18,  end:35,  color:'#3B6D11',
    desc:'Volume climbs. Long runs push to 18km. Open-water swim drills introduced. First Z3 intervals appear on Thursday runs.' },
  { id:'p3', name:'Swim & Run Build',        sub:'Months 9–12 ·  Weeks 36–52',  start:36,  end:52,  color:'#BA7517',
    desc:'Final swim/run-only phase. Peak running volume (24km long run). Swim hits 2.8km. Threshold intervals and tempo runs.' },
  { id:'p4', name:'Triathlon Base',          sub:'Months 13–16 · Weeks 53–69',  start:53,  end:69,  color:'#7C3AED',
    desc:'Cycling introduced (Wed + Sun). Tue/Thu runs maintained. Sat swim continues. Begin brick sessions (bike → run).' },
  { id:'p5', name:'Triathlon Build',         sub:'Months 17–20 · Weeks 70–87',  start:70,  end:87,  color:'#993C1D',
    desc:'Full triathlon intensity. Race-simulation bricks. Long rides 80–100km. 1.9km swim practice. Marathon-pace long runs.' },
  { id:'p6', name:'Peak & Taper',            sub:'Months 21–24 · Weeks 88–104', start:88,  end:104, color:'#534AB7',
    desc:'Peak fitness then structured taper. Final race simulations weeks 88–96. Volume drops 40% then 60% into race week.' },
];
 
/* ═══════════════════════════════════════════════
   NUTRITION DATABASE
═══════════════════════════════════════════════ */
const NUT = {
  run_easy:{
    pre:{timing:'2–3 hrs before', items:'Porridge with banana & honey, or 2 slices wholegrain toast with peanut butter', note:'Avoid high-fat/high-fibre foods close to session'},
    post:{timing:'Within 30–45 min', items:'Greek yoghurt with berries & granola, or protein smoothie (banana, milk, whey)', note:'20–25g protein + 40–50g carbs'}
  },

/* helper: which template for a given week */
function getTmpl(week) {
  if (week === null) return TEMPLATES[0];
  for (const t of TEMPLATES) {
    if (week >= t.wr[0] && week <= t.wr[1]) return t;
  }
  return TEMPLATES[TEMPLATES.length - 1];
}
function getPhase(week) {
  if (week === null) return PHASES[0];
  for (const p of PHASES) {
    if (week >= p.start && week <= p.end) return p;
  }
  return PHASES[PHASES.length - 1];
}
function weekNum(date) {
  const diff = date - PLAN_START;
  const d = Math.floor(diff / 86400000);
  if (d < 0) return null;
  return Math.min(Math.floor(d / 7) + 1, TOTAL_WEEKS);
}
/* day index 0=Mon … 6=Sun */
function dayIdx(date) {
  const d = date.getDay();
  return d === 0 ? 6 : d - 1;
}
function dateKey(d) { return d.toISOString().split('T')[0]; }

═══════════════════════════════════════════════ */
let completed = {};
let calDate = new Date();
 
function load() { try { completed = JSON.parse(localStorage.getItem('im703_v2') || '{}'); } catch(e) { completed = {}; } }
function save() { localStorage.setItem('im703_v2', JSON.stringify(completed)); }
 
/* ═══════════════════════════════════════════════
   RENDER TODAY
═══════════════════════════════════════════════ */
function renderToday() {
  const today = new Date(); today.setHours(0,0,0,0);
  const wk = weekNum(today);
  const di = dayIdx(today);
  const tmpl = getTmpl(wk);
  const day = tmpl.days[di];
  const phase = getPhase(wk);
  const key = dateKey(today);
  const done = !!completed[key];
 
  /* header */
  document.getElementById('headerMeta').innerHTML =
    today.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}).toUpperCase() +
    '<br>WEEK ' + (wk || '–') + ' / ' + TOTAL_WEEKS;
 
  /* progress */
  const totalDays = TOTAL_WEEKS * 7;
  const daysPassed = wk !== null ? Math.min((wk-1)*7 + di + 1, totalDays) : 0;
  const pct = wk !== null ? Math.round((daysPassed / totalDays) * 100) : 0;
  document.getElementById('progPct').innerHTML = pct + '<small>%</small>';
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('pWk').textContent = wk || '–';
  document.getElementById('pDone').textContent = Object.keys(completed).length;
  document.getElementById('pLeft').textContent = Math.max(0, totalDays - daysPassed);
 
  /* phase */
  document.getElementById('phaseDot').style.background = phase.color;
  document.getElementById('phaseName').textContent = phase.name;
  document.getElementById('phaseSub').textContent = phase.sub;
 
  /* discipline strip */
  const hasBike = wk !== null && wk >= 53;
  document.getElementById('discStrip').innerHTML = [
    { key:'swim', label:'Swim · Sat', icon:'🏊' },
    { key:'run',  label:'Run · Tue/Thu', icon:'🏃' },
    { key:'bike', label:'Bike · Wed/Sun', icon:'🚴', locked: !hasBike },
  ].map(d => `<div class="disc-pill ${d.locked ? 'inactive' : 'active-'+d.key}">
    <span>${d.icon}</span><span>${d.label}</span>${d.locked ? '<span style="font-size:9px;margin-left:2px">🔒 Month 13+</span>' : ''}
  </div>`).join('');
 
  /* today card */
  const badge = document.getElementById('todayBadge');
  badge.textContent = day.t === 'brick' ? 'BRICK' : day.t;
  badge.className = 'type-badge badge-' + day.t;
  document.getElementById('todayTitle').textContent = day.title;
  document.getElementById('todayDetail').textContent = day.detail;
  document.getElementById('durRow').textContent = '⏱ ' + day.dur;
  document.getElementById('zonesRow').innerHTML = day.zones.map(z =>
    `<span class="zpill ${z.toLowerCase()}">${z}</span>`).join('');
  const btn = document.getElementById('doneBtn');
  btn.className = 'done-btn' + (done ? ' done' : '');
  document.getElementById('doneTxt').textContent = done ? 'Completed ✓' : 'Mark done';
 
  /* nutrition */
  renderNut(day.nut, day.t);
 
  /* week strip */
  renderWeekStrip(wk, today, di, tmpl);
 
  /* history */
  renderHist();
}
 
function renderNut(key, type) {
  const n = NUT[key];
  const el = document.getElementById('nutCards');
  if (!n) { el.innerHTML = ''; return; }
  if (key === 'rest') {
    el.innerHTML = `<div class="nut-grid"><div class="nut-card nc-rest span2">
      <div class="nut-type">Rest day nutrition</div>
      <div class="nut-items">${n.general}</div></div></div>`;
    return;
  }
  const card = (cls, label, data, full) => data ? `
    <div class="nut-card nc-${cls}${full?' span2':''}">
      <div class="nut-type">${label}</div>
      <div class="nut-timing">${data.timing}</div>
      <div class="nut-items">${data.items}</div>
      ${data.note ? `<div class="nut-note">${data.note}</div>` : ''}
    </div>` : '';
  const hasDuring = !!n.during;
  el.innerHTML = `<div class="nut-grid">
    ${card('pre','Pre-workout',n.pre,false)}
    ${card('post','Post-workout',n.post,false)}
    ${hasDuring ? card('during','During session',n.during,true) : ''}
  </div>`;
}
 
function renderWeekStrip(wk, today, di, tmpl) {
  document.getElementById('wstripTitle').textContent = wk ? `Week ${wk}` : 'Pre-plan';
  document.getElementById('wstripSub').textContent = tmpl.label.toUpperCase();
  const el = document.getElementById('wdays');
  el.innerHTML = tmpl.days.map((d, i) => {
    const dd = new Date(today); dd.setDate(today.getDate() - di + i);
    const done = !!completed[dateKey(dd)];
    return `<div class="wday${i===di?' is-today':''}">
      ${done ? '<span class="wday-check">✓</span>' : ''}
      <div class="wday-n">${d.n}</div>
      <div class="wday-dot ${d.t}"></div>
      <div class="wday-lbl">${d.t}</div>
    </div>`;
  }).join('');
}
 
function renderHist() {
  const el = document.getElementById('histList');
  const entries = Object.entries(completed).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,60);
  if (!entries.length) {
    el.innerHTML = '<div class="hist-empty">No completed workouts yet.<br>Mark your first session above.</div>';
    return;
  }
  const colors = {swim:'var(--swim)',run:'var(--run)',bike:'var(--bike)',brick:'var(--gold)',rest:'var(--rest)'};
  el.innerHTML = entries.map(([k,v]) => {
    const d = new Date(k);
    const fmt = d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    return `<div class="hist-item">
      <div class="hist-dot" style="background:${colors[v.type]||'var(--rest)'}"></div>
      <div class="hist-date">${fmt}</div>
      <div class="hist-desc">${v.title||'Workout'}</div>
      <div class="hist-phase">${v.phase||''}</div>
    </div>`;
  }).join('');
}
 
/* ═══════════════════════════════════════════════
   ACTIONS
═══════════════════════════════════════════════ */
function toggleComplete() {
  const today = new Date(); today.setHours(0,0,0,0);
  const key = dateKey(today);
  const wk = weekNum(today);
  const di = dayIdx(today);
  const day = getTmpl(wk).days[di];
  const phase = getPhase(wk);
  if (completed[key]) { delete completed[key]; }
  else { completed[key] = { type: day.t, title: day.title, phase: phase.name, week: wk }; }
  save();
  const card = document.getElementById('todayCard');
  card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
  renderToday();
}
 
function toggleHist() {
  const el = document.getElementById('histList');
  const chev = document.getElementById('histChev');
  const open = el.classList.toggle('open');
  chev.classList.toggle('open', open);
  if (open) renderHist();
}
 
/* ═══════════════════════════════════════════════
   CALENDAR
═══════════════════════════════════════════════ */
function calMonth(dir) {
  calDate = new Date(calDate.getFullYear(), calDate.getMonth() + dir, 1);
  renderCal();
}
 
function renderCal() {
  const today = new Date(); today.setHours(0,0,0,0);
  const y = calDate.getFullYear(), m = calDate.getMonth();
  document.getElementById('calMonth').textContent =
    new Date(y,m,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}).toUpperCase();
  const dayNames = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
  let html = dayNames.map(n=>`<div class="cal-dn">${n}</div>`).join('');
  const firstDow = (new Date(y,m,1).getDay()+6)%7;
  const dim = new Date(y,m+1,0).getDate();
  const typeColors = {swim:'var(--swim)',run:'var(--run)',bike:'var(--bike)',brick:'var(--gold)',rest:'transparent'};
  for (let i=0;i<firstDow;i++) html += `<div class="cal-cell other-m"></div>`;
  for (let d=1;d<=dim;d++) {
    const date = new Date(y,m,d);
    const k = dateKey(date);
    const isToday = dateKey(date)===dateKey(today);
    const done = !!completed[k];
    const wk = weekNum(date);
    const di2 = dayIdx(date);
    const day = wk!==null ? getTmpl(wk).days[di2] : null;
    const dotColor = day ? (typeColors[day.t]||'transparent') : 'transparent';
    html += `<div class="cal-cell${isToday?' today-c':''}${done?' done-c':''}">
      ${done?'<span class="cal-chk">✓</span>':''}
      <div class="cal-cell-n">${d}</div>
      <div class="cal-cdot" style="background:${dotColor}"></div>
    </div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}
 
/* ═══════════════════════════════════════════════
   STATS
═══════════════════════════════════════════════ */
function renderStats() {
  const all = Object.values(completed);
  const total = all.length;
  const swims = all.filter(v=>v.type==='swim').length;
  const runs = all.filter(v=>v.type==='run').length;
  const bikes = all.filter(v=>v.type==='bike').length;
  const bricks = all.filter(v=>v.type==='brick').length;
 
  let streak = 0;
  const today = new Date(); today.setHours(0,0,0,0);
  for (let i=0;i<365;i++) {
    const d = new Date(today); d.setDate(today.getDate()-i);
    const wk = weekNum(d);
    const dd = wk!==null ? getTmpl(wk).days[dayIdx(d)] : null;
    if (dd && dd.t !== 'rest') { if (completed[dateKey(d)]) streak++; else break; }
  }
 
  const wk = weekNum(today);
  const totalDays = TOTAL_WEEKS * 7;
  const daysPassed = wk !== null ? Math.min((wk-1)*7 + dayIdx(today) + 1, totalDays) : 0;
  const pct = wk !== null ? Math.round((daysPassed/totalDays)*100) : 0;
 
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-num" style="color:var(--swim)">${total}</div><div class="stat-lbl">Total sessions</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--gold)">${streak}</div><div class="stat-lbl">Current streak</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--swim)">${swims}</div><div class="stat-lbl">Swims done</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--run)">${runs}</div><div class="stat-lbl">Runs done</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--bike)">${bikes}</div><div class="stat-lbl">Bike sessions</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--gold)">${bricks}</div><div class="stat-lbl">Bricks done</div></div>
    <div class="stat-card hero-card"><div class="stat-num" style="color:var(--gold)">${pct}%</div><div class="stat-lbl">Overall plan progress · Week ${wk||0} of ${TOTAL_WEEKS}</div></div>`;
 
  document.getElementById('phaseBars').innerHTML = PHASES.map(p => {
    const phDone = all.filter(v=>v.week>=p.start&&v.week<=p.end).length;
    const phTotal = (p.end - p.start + 1) * 7;
    const pp = Math.min(100, Math.round((phDone/phTotal)*100));
    return `<div class="pb-row">
      <div class="pb-label">${p.name}</div>
      <div class="pb-track"><div class="pb-fill" style="width:${pp}%;background:${p.color}"></div></div>
      <div class="pb-pct">${pp}%</div>
    </div>`;
  }).join('');
}
 
/* ═══════════════════════════════════════════════
   NAV
═══════════════════════════════════════════════ */
function switchView(v) {
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('nav-'+v).classList.add('active');
  if (v==='calendar') renderCal();
  if (v==='stats') renderStats();
}
 
/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
load();
renderToday();
</script>
</body>
</html>
